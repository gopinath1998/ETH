version: 2


models:

  - name: stg_token_transfers
    columns:
      - name: transaction_hash
        data_tests:
          - relationships:
              to: ref('stg_transactions')
              field: hash
              severity: warn
              config:
                store_failures: true
                store_failures_as: table
                where: date > current_date -30


  - name: "stg_transactions_enriched"
    columns:
      - name: value
        data_tests:
          - asserted_eth_value_positive:
              field: block_number
  - name: stg_transactions
    description:  "{{ doc('transactions') }}"
    columns:
      - name: hash
        description: >
          Multiline description added
          for the peoject
        data_tests:
          - unique
          - not_null
  - name: stable_coin_activity_per_day
    latest_version: 2
    config:
      contract:
        enforced: true
    columns:
      - name: date
        data_type: date
        description: "" 

      - name: token_address
        data_type: varchar
        description: ""

      - name: type
        data_type: varchar
        description: ""
        data_tests:
          - accepted_values:
              values: ['Hybrid','Crypto-backed','Fiat-backed']

      - name: symbol
        data_type: varchar
        description: ""

      - name: total_usd_value
        data_type: float
        description: ""

    versions:
      - v: 1
        deprecation_date: 2030-01-01
       # matches what's above
      - v: 2
      # Removed a column
        columns:
          - include: all
            exclude: [token_address,symbol]

unit_tests:
  - name: test_is_valid_transaction_category_breakdown
    model: stg_transactions_enriched
    overrides:
      macros:
        # unit test this model in "full refresh" mode
        is_incremental: false 
    given:
      - input: ref('stg_transactions')
        rows:
          - {receipt_contract_address: 'bla'}

      - input: ref('stg_token_transfers')
        rows:
          - {transaction_hash: 'bla'}



    expect:
      rows:
        - {transaction_category: 'contract_creation'}

exposures:

  - name: eth_activity_per_day
    type: dashboard

    depends_on:
      - ref('stg_transactions_enriched')

    owner:
      name: gopi guru
      email: data@gopi.com